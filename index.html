<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yichen Wang - Homepage</title>
  <meta name="description" content="Yichen Wang (王弈宸), Ph.D. student at National University of Defense Technology. Research on agents, agent memory, post-training, and long-horizon task planning.">
  <meta name="keywords" content="Yichen Wang, 王弈宸, NUDT, CLIMB, agents, agent memory, long-horizon planning">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a860a211d3.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #c2714f;
      --border: #e5e7eb;
      --card: #f9fafb;
      --nav-h: 56px;
      --max: 980px;
      --side: 260px;
    }
    html[data-theme="dark"] {
      --bg: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #e28a67;
      --border: #374151;
      --card: #1f2937;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15.5px;
      line-height: 1.7;
      transition: background-color .25s ease, color .25s ease;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }

    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    html[data-theme="dark"] .top-nav {
      background: rgba(17,24,39,.92);
    }
    .nav-inner {
      max-width: calc(var(--max) + 40px);
      margin: 0 auto;
      height: 100%;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
    }
    .nav-brand {
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      margin-right: 8px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }
    .nav-links a {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 8px;
      border-radius: 6px;
      white-space: nowrap;
      text-decoration: none;
    }
    .nav-links a:hover {
      color: var(--accent);
      background: var(--card);
      text-decoration: none;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      background: transparent;
      padding: 0;
      cursor: pointer;
      height: 32px;
    }
    .lang-toggle span {
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .lang-toggle span.active {
      background: var(--accent);
      color: #fff;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }

    .layout {
      max-width: calc(var(--max) + 40px);
      margin: 0 auto;
      padding: 28px 20px 60px;
      display: grid;
      grid-template-columns: var(--side) 1fr;
      gap: 36px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: calc(var(--nav-h) + 20px);
    }
    .profile-card { text-align: center; }
    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      margin-bottom: 14px;
    }
    .site-name {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
    }
    .affil {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .emails {
      margin: 0 0 14px;
      font-size: 12.5px;
      line-height: 1.8;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .emails a { color: var(--muted); display: block; }
    .emails a:hover { color: var(--accent); }
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .social-icons a {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .social-icons a:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      text-decoration: none;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .tag {
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .content { min-width: 0; }
    .section { margin-bottom: 36px; scroll-margin-top: calc(var(--nav-h) + 16px); }
    .section-title {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 700;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    .section-body p { margin: 0 0 12px; }
    .research-line { color: var(--muted); font-size: 14px; margin-top: 8px; }

    .news-list { list-style: none; margin: 0; padding: 0; }
    .news-item {
      position: relative;
      padding: 0 0 16px 18px;
      margin-left: 6px;
      border-left: 2px solid var(--border);
    }
    .news-item:last-child { padding-bottom: 0; border-left-color: transparent; }
    .news-item::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 7px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
    }
    .news-date {
      color: var(--accent);
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 2px;
      font-variant-numeric: tabular-nums;
    }
    .news-text { margin: 0; font-size: 15px; }

    .paper-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: var(--card);
    }
    .paper-status {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .02em;
      margin-bottom: 10px;
    }
    .paper-figure {
      margin: 0 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      overflow: hidden;
    }
    .paper-figure img { display: block; width: 100%; }
    .paper-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }
    .paper-links { font-size: 14px; }
    .paper-links a { margin-right: 10px; font-weight: 600; }

    .edu-item {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
    }
    .edu-item:last-child { margin-bottom: 0; }
    .edu-logo {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 10px;
    }
    .exp-title { margin: 0 0 2px; font-size: 15px; }
    .exp-detail { margin: 0 0 2px; color: var(--muted); font-size: 14px; }
    .exp-period { margin: 0; color: var(--accent); font-size: 13px; font-weight: 600; }

    .site-footer {
      max-width: calc(var(--max) + 40px);
      margin: 0 auto;
      padding: 0 20px 40px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 20px;
        padding-top: 20px;
      }
      .sidebar { position: static; }
      .avatar { width: 140px; height: 140px; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a class="nav-brand" href="#about">Yichen Wang</a>
      <div class="nav-links" id="navLinks"></div>
      <div class="nav-actions">
        <button id="langToggle" class="lang-toggle" aria-label="Switch language">
          <span id="langEn" class="active">EN</span>
          <span id="langZh">中文</span>
        </button>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <div class="profile-card">
        <img class="avatar" src="assets/img/avatar.jpg" alt="Yichen Wang">
        <h1 class="site-name" data-i18n="name">Yichen Wang</h1>
        <p class="affil">
          <span data-i18n="affilLine1"></span><br>
          <span data-i18n="affilLine2"></span><br>
          <span data-i18n="affilLine3"></span>
        </p>
        <div class="emails">
          <a href="mailto:wangyichen.wyc@nudt.edu.cn">wangyichen.wyc@nudt.edu.cn</a>
          <a href="mailto:yichenwang2002@gmail.com">yichenwang2002@gmail.com</a>
        </div>
        <div class="social-icons">
          <a href="mailto:wangyichen.wyc@nudt.edu.cn" title="Email (NUDT)"><i class="fa-solid fa-envelope"></i></a>
          <a href="mailto:yichenwang2002@gmail.com" title="Email (Gmail)"><i class="fa-solid fa-envelope"></i></a>
          <a href="https://github.com/YichenWang2002" title="GitHub" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i></a>
        </div>
        <div class="tag-list" id="interestTags"></div>
      </div>
    </aside>

    <main class="content">
      <section class="section" id="about">
        <h2 class="section-title" data-i18n="aboutTitle">🧐 About Me</h2>
        <div class="section-body">
          <p data-i18n="aboutP1"></p>
          <p data-i18n="aboutP2"></p>
        </div>
      </section>

      <section class="section" id="news">
        <h2 class="section-title" data-i18n="newsTitle">🔥 News</h2>
        <div class="section-body">
          <ul class="news-list" id="newsList"></ul>
        </div>
      </section>

      <section class="section" id="papers">
        <h2 class="section-title" data-i18n="papersTitle">📄 Papers Under Review</h2>
        <div class="section-body">
          <div class="paper-card">
            <div class="paper-status" data-i18n="paperStatus">Under Review</div>
            <div class="paper-figure">
              <img src="assets/img/climb_overview.png" alt="Overview of CLIMB">
            </div>
            <div class="paper-title" data-i18n="paperTitle"></div>
            <div class="paper-links">
              <a href="https://github.com/YichenWang2002/CLIMB" target="_blank" rel="noopener">[Code]</a>
              <a href="https://yichenwang2002.github.io/CLIMB/" target="_blank" rel="noopener">[Project]</a>
              <span data-i18n="paperStatusInline">Under Review</span>
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="interests">
        <h2 class="section-title" data-i18n="interestsTitle">🔬 Research Interests</h2>
        <div class="section-body">
          <div class="tag-list" id="interestTagsMain" style="justify-content:flex-start"></div>
          <p class="research-line" data-i18n="interestsNote"></p>
        </div>
      </section>

      <section class="section" id="education">
        <h2 class="section-title" data-i18n="eduTitle">📖 Education</h2>
        <div class="section-body">
          <div class="edu-item">
            <img class="edu-logo" src="assets/img/institution-nudt.svg" alt="NUDT">
            <div>
              <p class="exp-title"><strong data-i18n="edu2School"></strong></p>
              <p class="exp-detail" data-i18n="edu2Dept"></p>
              <p class="exp-detail" data-i18n="edu2Degree"></p>
              <p class="exp-period">2025 – <span data-i18n="present"></span></p>
            </div>
          </div>
          <div class="edu-item">
            <img class="edu-logo" src="assets/img/institution-ysu.svg" alt="Yanshan University">
            <div>
              <p class="exp-title"><strong data-i18n="edu1School"></strong></p>
              <p class="exp-detail" data-i18n="edu1Dept"></p>
              <p class="exp-detail" data-i18n="edu1Degree"></p>
              <p class="exp-detail" data-i18n="edu1Meta"></p>
              <p class="exp-period">2021 – 2025</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Yichen Wang. <span data-i18n="rights"></span></p>
  </footer>

  <script>
    (function () {
      const i18n = {
        en: {
          name: 'Yichen Wang',
          affilLine1: 'Ph.D. Student (2nd year, entered 2025)',
          affilLine2: 'College of Computer Science and Technology',
          affilLine3: 'National University of Defense Technology',
          aboutTitle: '🧐 About Me',
          aboutP1: 'I am <strong>Yichen Wang</strong> (王弈宸), a second-year Ph.D. student at the College of Computer Science and Technology, National University of Defense Technology (NUDT), Changsha, China. I entered the Ph.D. program in 2025.',
          aboutP2: 'My research focuses on large language models and agents. I am currently interested in long-horizon task planning for agents, and especially in how small-parameter models can acquire capabilities typically associated with large models.',
          newsTitle: '🔥 News',
          news: [
            { date: '2026.09', text: '🎉 My personal academic homepage is now online.' },
            { date: '2026.09', text: '🎉 Project page and code for CLIMB (ICASSP 2027 under review) are released.' },
            { date: '2025.09', text: '🎉 I joined the National University of Defense Technology (NUDT) and began my Ph.D. studies.' }
          ],
          papersTitle: '📄 Papers Under Review',
          paperStatus: 'Under Review',
          paperStatusInline: 'Under Review',
          paperTitle: 'CLIMB: Curriculum Learning for Multi-Agent Behavior Tree Generation with Small Language Models',
          interestsTitle: '🔬 Research Interests',
          interestsNote: 'Current focus: making small models capable on agent long-horizon planning.',
          interests: ['Agents', 'Agent Memory', 'OPD', 'Post-training', 'Long-horizon Task Planning'],
          eduTitle: '📖 Education',
          edu2School: 'National University of Defense Technology',
          edu2Dept: 'College of Computer Science and Technology',
          edu2Degree: 'Ph.D. in Computer Science and Technology',
          present: 'Present',
          edu1School: 'Yanshan University',
          edu1Dept: 'College of Information Science and Engineering',
          edu1Degree: 'B.S. in Software Engineering',
          edu1Meta: 'GPA: 3.8 / 4.5 · Top 3%',
          rights: 'All rights reserved.',
          nav: [
            ['about', 'About'],
            ['news', 'News'],
            ['papers', 'Papers'],
            ['interests', 'Research'],
            ['education', 'Education']
          ]
        },
        zh: {
          name: '王弈宸',
          affilLine1: '博士研究生（2025 级 · 二年级）',
          affilLine2: '计算机学院',
          affilLine3: '国防科技大学',
          aboutTitle: '🧐 关于我',
          aboutP1: '我是<strong>王弈宸</strong>（Yichen Wang），国防科技大学计算机学院 2025 级博士研究生。',
          aboutP2: '我的研究兴趣为大模型和智能体，当前关注智能体长程任务规划问题，尤其关注如何让小参数量的模型具备大模型的能力。',
          newsTitle: '🔥 新闻动态',
          news: [
            { date: '2026.09', text: '🎉 个人学术主页正式上线。' },
            { date: '2026.09', text: '🎉 CLIMB（ICASSP 2027 在投）项目主页与代码开源。' },
            { date: '2025.09', text: '🎉 我正式加入国防科技大学（NUDT），开始博士阶段的学习。' }
          ],
          papersTitle: '📄 在审论文',
          paperStatus: 'Under Review',
          paperStatusInline: 'Under Review',
          paperTitle: 'CLIMB: Curriculum Learning for Multi-Agent Behavior Tree Generation with Small Language Models',
          interestsTitle: '🔬 研究兴趣',
          interestsNote: '当前重点：让小模型在智能体长程规划任务上具备更强能力。',
          interests: ['智能体', '智能体记忆', 'OPD', '后训练', '长程任务规划'],
          eduTitle: '📖 教育经历',
          edu2School: '国防科技大学',
          edu2Dept: '计算机学院',
          edu2Degree: '计算机科学与技术 · 博士在读',
          present: '至今',
          edu1School: '燕山大学',
          edu1Dept: '信息科学与工程学院',
          edu1Degree: '软件工程 · 工学学士',
          edu1Meta: 'GPA：3.8 / 4.5 · 专业排名前 3%',
          rights: '保留所有权利。',
          nav: [
            ['about', '关于'],
            ['news', '新闻'],
            ['papers', '论文'],
            ['interests', '研究'],
            ['education', '教育']
          ]
        }
      };

      function getLang() {
        return localStorage.getItem('lang') === 'zh' ? 'zh' : 'en';
      }

      function setLang(lang) {
        const dict = i18n[lang];
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.title = lang === 'zh' ? '王弈宸 - 主页' : 'Yichen Wang - Homepage';

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          const key = el.getAttribute('data-i18n');
          if (dict[key] == null) return;
          el.innerHTML = dict[key];
        });

        const tags = dict.interests.map(function (t) {
          return '<span class="tag">' + t + '</span>';
        }).join('');
        document.getElementById('interestTags').innerHTML = tags;
        document.getElementById('interestTagsMain').innerHTML = tags;

        document.getElementById('newsList').innerHTML = dict.news.map(function (item) {
          const parts = item.text.split('🎉');
          const body = parts.length > 1 ? parts.slice(1).join('🎉').trim() : item.text;
          return '<li class="news-item">' +
            '<div class="news-date">' + item.date + ' 🎉</div>' +
            '<p class="news-text">' + body + '</p>' +
            '</li>';
        }).join('');

        document.getElementById('navLinks').innerHTML = dict.nav.map(function (n) {
          return '<a href="#' + n[0] + '">' + n[1] + '</a>';
        }).join('');

        document.getElementById('langEn').classList.toggle('active', lang === 'en');
        document.getElementById('langZh').classList.toggle('active', lang === 'zh');
        localStorage.setItem('lang', lang);
      }

      const themeToggle = document.getElementById('themeToggle');
      const icon = themeToggle.querySelector('i');
      function setTheme(isDark) {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      }
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme ? savedTheme === 'dark' : prefersDark);
      themeToggle.addEventListener('click', function () {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        setTheme(!isDark);
      });

      document.getElementById('langToggle').addEventListener('click', function () {
        setLang(getLang() === 'zh' ? 'en' : 'zh');
      });

      setLang(getLang());
      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
